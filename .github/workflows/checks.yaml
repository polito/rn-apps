name: Checks
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [lint, format, types, deps, test]
    name: "Code linting: ${{ matrix.check }}"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ./node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('./package-lock.json') }}
    - name: Cache Jest transform cache
      if: matrix.check == 'test'
      uses: actions/cache@v4
      with:
        path: |
          ./students/.jest-cache
          ./faculty/.jest-cache
        key: ${{ runner.os }}-jest-${{ hashFiles('./package-lock.json', './students/jest.config.js', './faculty/jest.config.js', './students/babel.config.js', './faculty/babel.config.js') }}
    - name: Setup .npmrc
      run: printf '@polito:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}\n' > .npmrc
    - name: Install npm dependencies
      run: npm install
    - name: Run check
      run: npm run ${{ matrix.check }}:check
